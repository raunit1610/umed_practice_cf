AWSTemplateFormatVersion: "2010-09-09"
Description: >
  uMed EHR Data Platform: S3 Bucket Stack
  Creates all eight S3 buckets (Raw, Staging, Intermediate, Data Warehouse,
  Analytics, Audit, Control, Athena Results) for a single environment with
  full HIPAA-compliant configuration. Deploy once per environment (nonprod/prod)
  supplying the environment name and KMS CMK ARN.

# ──────────────────────────────────────────────────────────────────────────────
# Parameters
# ──────────────────────────────────────────────────────────────────────────────
Parameters:

  Account:
    Type: String
    AllowedValues: [nonprod, prodil]
    Description: Deployment environment. Controls bucket naming and prod-only features.

# ──────────────────────────────────────────────────────────────────────────────
# Conditions
# ──────────────────────────────────────────────────────────────────────────────
Conditions:

  IsProd: !Equals [!Ref Account, prodil]

  IsNonProd: !Not
    - !Condition IsProd


# ──────────────────────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────────────────────
Resources:
# =====================================================
# KMS KEY
# =====================================================
  ProdKmsKey:
    Type: AWS::KMS::Key
    Condition: IsProd
    Properties:
      Description: "uMed Prod S3 Encryption Key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

          - Sid: AllowCloudTrailToEncryptLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
            Resource: "*"
  ProdKmsAlias:
    Type: AWS::KMS::Alias
    Condition: IsProd
    Properties:
      AliasName: alias/umed-data-platform-prod-s3-key
      TargetKeyId: !Ref ProdKmsKey

  DevKmsKey:
    Type: AWS::KMS::Key
    Condition: IsNonProd
    Properties:
      Description: "uMed Dev S3 Encryption Key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

          - Sid: AllowCloudTrailToEncryptLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
            Resource: "*"
  DevKmsAlias:
    Type: AWS::KMS::Alias
    Condition: IsNonProd
    Properties:
      AliasName: alias/umed-data-platform-dev-s3-key
      TargetKeyId: !Ref DevKmsKey

  QaKmsKey:
    Type: AWS::KMS::Key
    Condition: IsNonProd
    Properties:
      Description: "uMed QA S3 Encryption Key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

          - Sid: AllowCloudTrailToEncryptLogs
            Effect: Allow
            Principal:
