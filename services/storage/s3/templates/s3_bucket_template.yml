  # ============================================================
  # 6. AUDIT BUCKET  –  umed-audit-logs-{env}
  # Stores: HIPAA audit trail, file-level and table-level audit records
  #         for each pipeline layer
  #
  # HIPAA requirements drive special settings:
  #   • Versioning ENABLED (required for Object Lock)
  #   • Object Lock COMPLIANCE mode, 7-year retention (6yr HIPAA + 1yr buffer)
  #   • Server access logging NOT used – CloudTrail Data Events provide the
  #     equivalent tamper-proof access record without a self-referential
  #     circular dependency. Enable CloudTrail Data Events post-deployment.
  #   • NO lifecycle transitions – records must remain query-accessible
  # ============================================================
  ProdAuditBucket:
    Type: AWS::S3::Bucket
    Condition: IsProd
    Properties:
      BucketName: "umed-audit-logs-prod"

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      # Versioning MUST be enabled for Object Lock
      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ProdKmsKey

      # Object Lock – COMPLIANCE mode, 7 years (2555 days)
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: 2555  

      Tags:
        - Key: Project
          Value: uMed
        - Key: Layer
          Value: audit
        - Key: Environment
          Value: PROD
        - Key: DataClass
          Value: Operational
        - Key: Owner
          Value: data-engineering@uMed.com

  # Bucket policy (allows CloudTrail to write to the audit bucket)
  ProdAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProd
    Properties:
      Bucket: !Ref ProdAuditBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailACLCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt ProdAuditBucket.Arn

          - Sid: AllowCloudTrailPutObject
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${ProdAuditBucket.Arn}/cloudtrail/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control


