  # ============================================================
  # 1. RAW BUCKET  –  umed-raw-ehr-{env}
  # Stores: original FHIR NDJSON records  (immutable source)
  # ============================================================
  ProdRawBucket:
    Type: AWS::S3::Bucket
    Condition: IsProd 
    Properties:
      BucketName: "umed-raw-ehr-prod"

      # Block all public access 
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # Object ownership 
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      # Versioning disabled 
      VersioningConfiguration:
        Status: Suspended

      # SSE-KMS with Customer Managed Key + Bucket Key 
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ProdKmsKey

      # Lifecycle – transition to Glacier Instant Retrieval after 90 days
      LifecycleConfiguration:
        Rules:
          - Id: RawToGlacierIR
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90

      # Server access logging 
      LoggingConfiguration: 
        DestinationBucketName: !Ref ProdAuditBucket
        LogFilePrefix: "server-access-logs/raw-prod/"

      Tags:
        - Key: Project
          Value: uMed
        - Key: Layer
          Value: raw
        - Key: Environment
          Value: PROD
        - Key: DataClass
          Value: PHI
        - Key: Owner
          Value: data-engineering@uMed.com


